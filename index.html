<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="output">
            <div class="message system">
                Welcome to my interactive portfolio. <br>
                Type <span class="highlight">'help'</span> to see a list of available commands.
            </div>
        </div>
        <div id="input-line">
            <span class="prompt">user@portfolio:~$ </span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
